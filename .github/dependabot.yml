version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # TS 7 blocked until typescript-eslint + ts-jest support it (typescript-eslint#10940)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest 5 stops applying the root config's globals: true to packages without
      # their own vitest config, breaking bare describe/it in @kopai/collector (#176)
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
